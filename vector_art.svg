<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" width="40" height="32">
  <!-- Deck guy, redrawn as vector paths.

       Coordinates are the sprite's own 40 x 32 fine grid, deliberately: prop
       anchors in sprites.py COSTUMES are authored in that space, so the hard
       hat and the book keep landing exactly where they always did while the
       body underneath stops being a bitmap.

       Traced from the 20 x 16 body grid, doubled:

           .....OOOOOOOOOO.....     body   cols 10-29, rows 12-27
           .....O##OOOO##O.....     eyes   cols 12-15, 24-27, rows 16-19
           ...OOOOOOOOOOOOOO...     arms   cols 6-9, 30-33, rows 20-23
           .....OOOOOOOOOO.....
           .....OO..OO..OO.....     legs   cols 10-13, 18-21, 26-29, rows 28-31

       Three legs, flush with the body edges, two-cell gaps between them.

       Arms and legs each reach four units INTO the torso. That overlap is
       painted over by the body and never seen; it exists so that no amount of
       arm swing or leg lift can open a seam at the joint.

       Corner radii are the whole restyle: same silhouette, no stair-steps. -->

  <rect id="leg_l" x="10" y="24" width="4" height="8" rx="1.2" fill="#D77656"/>
  <rect id="leg_m" x="18" y="24" width="4" height="8" rx="1.2" fill="#D77656"/>
  <rect id="leg_r" x="26" y="24" width="4" height="8" rx="1.2" fill="#D77656"/>

  <rect id="arm_l" x="6"  y="20" width="8" height="4" rx="1.6" fill="#D77656"/>
  <rect id="arm_r" x="26" y="20" width="8" height="4" rx="1.6" fill="#D77656"/>

  <rect id="body" x="10" y="12" width="20" height="16" rx="2.0" fill="#D77656"/>

  <rect id="eye_l" x="12" y="16" width="4" height="4" rx="0.8" fill="#101010"/>
  <rect id="eye_r" x="24" y="16" width="4" height="4" rx="0.8" fill="#101010"/>

  <!-- one catchlight per eye; the sprite had none, and it is most of what makes
       a vector eye look wet rather than like a hole -->
  <rect id="shine_l" x="12.7" y="16.7" width="1.1" height="1.1" rx="0.55"
        fill="#FFFFFF" fill-opacity="0.85"/>
  <rect id="shine_r" x="24.7" y="16.7" width="1.1" height="1.1" rx="0.55"
        fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Measurement only, never drawn. -->
  <g id="boxes" display="none">
    <rect id="box_body" x="10" y="12" width="20" height="16"/>
    <rect id="box_all"  x="6"  y="12" width="28" height="20"/>
  </g>

  <!-- Transform pivots. Leg pivots sit at the buried top edge so a lift
       shortens the leg from the foot and never lets go of the torso. -->
  <g id="anchors" display="none">
    <circle id="anchor_body"  cx="20" cy="20" r="0.5"/>
    <circle id="anchor_feet"  cx="20" cy="32" r="0.5"/>
    <circle id="anchor_head"  cx="20" cy="16" r="0.5"/>
    <circle id="anchor_eye_l" cx="14" cy="18" r="0.5"/>
    <circle id="anchor_eye_r" cx="26" cy="18" r="0.5"/>
    <circle id="anchor_arm_l" cx="14" cy="22" r="0.5"/>
    <circle id="anchor_arm_r" cx="26" cy="22" r="0.5"/>
    <circle id="anchor_leg_l" cx="12" cy="24" r="0.5"/>
    <circle id="anchor_leg_m" cx="20" cy="24" r="0.5"/>
    <circle id="anchor_leg_r" cx="28" cy="24" r="0.5"/>
  </g>
</svg>
